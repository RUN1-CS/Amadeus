name: Code Quality

on:
  workflow_call:

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: Frontend lint and dependency consistency
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js and install dependencies
        uses: ./.github/actions/setup-environment
        with:
          project-directory: web
          install-dependencies: true
      - name: Check dependency manifests
        run: node --experimental-strip-types .github/scripts/check-dependencies.ts
      - name: Lint
        working-directory: web
        run: |
          npx oxlint .
          npx eslint . --no-cache