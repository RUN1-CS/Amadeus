services:
  postgres:
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:pg17}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-amadeus}
      POSTGRES_USER: ${POSTGRES_USER:-amadeus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: ${POSTGRES_HEALTHCHECK_INTERVAL:-5s}
      timeout: ${POSTGRES_HEALTHCHECK_TIMEOUT:-5s}
      retries: ${POSTGRES_HEALTHCHECK_RETRIES:-10}
    restart: unless-stopped

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-4096}
      COMFYUI_BASE_URL: ${COMFYUI_BASE_URL:-http://comfyui:8188}
      COMFYUI_DEFAULT_NEGATIVE_PROMPT: ${COMFYUI_DEFAULT_NEGATIVE_PROMPT:-}
      DATABASE_URL: postgres://${POSTGRES_USER:-amadeus}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-amadeus}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?Set DATA_ENCRYPTION_KEY in .env}
      DATABASE_BACKUPS_ENABLED: ${DATABASE_BACKUPS_ENABLED:-true}
      DATABASE_BACKUP_DIRECTORY: ${DATABASE_BACKUP_DIRECTORY:-/backups}
      DATABASE_BACKUP_RETENTION_DAYS: ${DATABASE_BACKUP_RETENTION_DAYS:-30}
      PG_DUMP_PATH: ${PG_DUMP_PATH:-pg_dump}
      PG_RESTORE_PATH: ${PG_RESTORE_PATH:-pg_restore}
      DATABASE_BACKUP_MAX_UPLOAD_BYTES: ${DATABASE_BACKUP_MAX_UPLOAD_BYTES:-1073741824}
      DATABASE_BACKUP_TIMEOUT_MS: ${DATABASE_BACKUP_TIMEOUT_MS:-1800000}
    volumes:
      - database-backups:${DATABASE_BACKUP_DIRECTORY:-/backups}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${SERVER_BIND_ADDRESS:-0.0.0.0}:${SERVER_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  comfyui:
    image: ghcr.io/ai-dock/comfyui@sha256:ca4c95d4d4743d7d5683e57f5e0358fe586bc57578f66c2a844e9fa0650cc619

    container_name: comfyui
    restart: unless-stopped

    ports:
      - "127.0.0.1:8188:8188"
      - "127.0.0.1:1111:1111"

    volumes:
      - ${COMFYUI_MODELS_PATH}:/opt/ComfyUI/models
      - output:/opt/ComfyUI/output
      - input:/opt/ComfyUI/input

    environment:
      AUTO_UPDATE: "false"
      WEB_ENABLE_AUTH: ${WEBUI_ENABLE_AUTH:-true}
      WEB_USER: ${WEBUI_USERNAME:-admin}
      WEB_PASSWORD: ${WEBUI_PASSWORD:?Set WEB_PASSWORD in .env}
      COMFYUI_ARGS: "--listen 0.0.0.0"

    deploy:
      resources:
        reservations:
          devices:
            - driver: cdi
              device_ids:
                - nvidia.com/gpu=all
              capabilities: [gpu]

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_NOVELTY: ${VITE_NOVELTY:-false}
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      server:
        condition: service_healthy
      comfyui:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres-data:
  database-backups:
  output:
  input:

networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 172.19.0.0/16
          gateway: 172.19.0.1
